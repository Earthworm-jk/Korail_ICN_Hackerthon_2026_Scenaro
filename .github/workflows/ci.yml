name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Golden evaluation (#181)
        run: pnpm eval:golden

      - name: Pipeline and source verifier unit tests (Python)
        run: >-
          python3 -m unittest
          scripts.test_build_place_rankings
          scripts.test_build_train_snapshot
          scripts.test_promote_runtime_catalog
          scripts.test_verify_stay_sources
          -v

      - name: Runtime ranking coverage
        run: python3 scripts/build_place_rankings.py --check

      - name: Build
        run: pnpm build
