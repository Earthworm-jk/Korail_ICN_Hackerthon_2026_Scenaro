name: Apply stage backend patch

on:
  push:
    branches:
      - agent/ui-stage-workspace-v2
    paths:
      - scripts/apply-stage-backend-patch.mjs
      - .github/workflows/apply-stage-backend-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-stage-backend]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-stage-workspace-v2
          fetch-depth: 0

      - name: Apply targeted planner patch
        run: node scripts/apply-stage-backend-patch.mjs

      - name: Remove one-shot patch helpers
        run: git rm scripts/apply-stage-backend-patch.mjs .github/workflows/apply-stage-backend-patch.yml

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit patched planner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/planner-wizard.tsx
          git commit -m "fix: align initial place selection with itinerary"
          git push origin HEAD:agent/ui-stage-workspace-v2
