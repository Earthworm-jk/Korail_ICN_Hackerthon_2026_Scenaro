name: Stay source monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Verify official stay-source quotes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source pages
        run: python3 scripts/verify_stay_sources.py
