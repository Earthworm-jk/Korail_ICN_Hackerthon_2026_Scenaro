name: Fix map label contract

on:
  push:
    branches:
      - agent/ui-stage-workspace-v2
    paths:
      - .github/workflows/fix-map-label-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-stage-workspace-v2
          fetch-depth: 0
      - run: node scripts/fix-map-label-contract.mjs
      - run: git diff --check
      - name: Commit test contract and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/__tests__/map-labels.test.ts
          git rm scripts/fix-map-label-contract.mjs .github/workflows/fix-map-label-contract.yml
          git commit -m "test: align map label contract with compact labels"
          git push origin HEAD:agent/ui-stage-workspace-v2
